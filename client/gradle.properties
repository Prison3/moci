org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Flask 后端地址（gRPC 网关，默认端口 50051）：
#  - 生产环境：http://8.145.53.212:50051
#  - 模拟器访问本机：http://10.0.2.2:50051
#  - 真机局域网调试：http://<电脑局域网IP>:50051
#  兼容旧配置 :5000 / :5002 会自动映射到 moci.grpcPort
moci.baseUrl=http://8.145.53.212:50051

# 后端是 http（无 TLS）时设为 true；https 部署务必设为 false
moci.cleartext=true

# gRPC 双向流端口（与 Flask 同机，默认 50051）
moci.grpcPort=50051
