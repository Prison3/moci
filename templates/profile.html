{% extends "base.html" %}
{% block title %}我的 · 墨词{% endblock %}
{% block subtitle %}账号{% endblock %}
{% block content %}
<section class="panel profile-card">
  <div class="profile-head">
    <div>
      <h1>{{ current_user.username }}</h1>
      <p>
        <span class="badge badge-mastered">管理员</span>
      </p>
    </div>
    <a class="btn btn-ghost btn-compact" href="{{ url_for('logout') }}">退出登录</a>
  </div>
</section>

<section class="panel">
    <h2>管理</h2>
    <p class="muted">审核注册、维护词库，并把学生绑定给家长。学生和家长请使用 App。</p>
    <a class="btn btn-primary btn-block" href="{{ url_for('admin_users') }}">管理用户</a>
    <a class="btn btn-ghost btn-block" href="{{ url_for('admin_learning') }}">学习情况</a>
    <a class="btn btn-ghost btn-block" href="{{ url_for('word_new') }}">录入单词</a>
</section>
{% endblock %}
