{% extends "base.html" %}
{% block title %}登录 · 墨词{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block subtitle %}管理员后台{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>管理员登录</h1>
  <p class="lead">网页端仅供管理员使用。学生和家长请使用 App 学习与查看进度。</p>
  <form method="post" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      <span>用户名</span>
      <input type="text" name="username" required maxlength="20" autocomplete="username" inputmode="text">
    </label>
    <label>
      <span>密码</span>
      <input type="password" name="password" required minlength="6" autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">登录</button>
  </form>
  {% if allow_register %}
  <p class="auth-switch">首次部署？<a href="{{ url_for('register') }}">创建管理员账号</a></p>
  {% endif %}
</section>
{% endblock %}
