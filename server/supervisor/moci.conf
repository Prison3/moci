[program:moci]
directory=/root/moci/server
command=/root/moci/server/.venv/bin/gunicorn --workers 1 --threads 4 --bind 0.0.0.0:5000 --timeout 60 'app:create_app()'
environment=DATABASE_URL="sqlite:///instance/words.db",GRPC_PORT="50051"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/moci.stdout.log
stderr_logfile=/var/log/supervisor/moci.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
