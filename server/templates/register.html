{% extends "base.html" %}
{% block title %}创建管理员 · 墨词{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block subtitle %}首次部署{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>创建管理员</h1>
  <p class="lead">第一位注册用户将成为管理员。学生和家长请在 App 中注册。</p>
  <form method="post" class="form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      <span>用户名</span>
      <input type="text" name="username" required minlength="2" maxlength="20" autocomplete="username">
    </label>
    <label>
      <span>密码</span>
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>
      <span>确认密码</span>
      <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">创建管理员</button>
  </form>
  <p class="auth-switch">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
</section>
{% endblock %}
